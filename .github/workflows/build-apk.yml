name: Build myday2 APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JS dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK (installable / shareable right away)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release-profile APK (same signing key for now)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: myday2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: myday2-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APKs for the release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk myday2-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk myday2-release.apk

      - name: Publish APKs to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          body: Automatically built from the latest push to main.
          prerelease: true
          make_latest: true
          files: |
            myday2-debug.apk
            myday2-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
